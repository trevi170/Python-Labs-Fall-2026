<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Python Labs — Learn & Practice</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0e27;
      --bg-secondary: #1a1f3a;
      --text: #e0e6ff;
      --text-secondary: #a8b2d1;
      --border: rgba(0, 255, 136, 0.2);
      --primary: #00ff88;
      --primary-dark: #00cc6a;
      --accent: #00d9ff;
      --danger: #ff0055;
      --radius: 8px;
      --font-sans: 'Courier New', monospace;
    }
    body {
      font-family: var(--font-sans);
      background: linear-gradient(135deg, #0a0e27 0%, #1a0033 50%, #0a0e27 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(0, 255, 136, 0.03) 0px,
          rgba(0, 255, 136, 0.03) 1px,
          transparent 1px,
          transparent 2px
        );
      pointer-events: none;
      z-index: 1;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }
    .header {
      text-align: center;
      margin-bottom: 50px;
      animation: fadeIn 0.6s ease-in;
      padding: 20px;
      border: 2px solid var(--primary);
      border-radius: var(--radius);
      background: rgba(0, 255, 136, 0.05);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.2), inset 0 0 20px rgba(0, 255, 136, 0.05);
    }
    .header h1 {
      font-size: 48px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--primary);
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
      letter-spacing: 2px;
    }
    .header p {
      font-size: 16px;
      opacity: 0.9;
      max-width: 600px;
      margin: 0 auto;
      color: var(--text-secondary);
    }
    .labs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }
    .lab-card {
      background: rgba(26, 31, 58, 0.6);
      border-radius: var(--radius);
      border: 1px solid var(--primary);
      padding: 24px;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.1);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .lab-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 136, 0.1), transparent);
      transition: left 0.5s ease;
    }
    .lab-card:hover::before {
      left: 100%;
    }
    .lab-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.3), inset 0 0 20px rgba(0, 255, 136, 0.05);
      border-color: var(--accent);
    }
    .lab-badge {
      display: inline-block;
      background: rgba(0, 255, 136, 0.1);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
      width: fit-content;
      border: 1px solid var(--primary);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .lab-title {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--accent);
      position: relative;
      z-index: 1;
    }
    .lab-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 16px;
      flex-grow: 1;
      position: relative;
      z-index: 1;
    }
    .lab-meta {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--text-secondary);
      position: relative;
      z-index: 1;
    }
    .meta-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .lab-links {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 4px;
      border: 1px solid var(--primary);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 1px;
      position: relative;
      overflow: hidden;
    }
    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: var(--primary);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.4s, height 0.4s;
      z-index: -1;
    }
    .btn:hover::before {
      width: 300px;
      height: 300px;
    }
    .btn-primary {
      background: transparent;
      color: var(--primary);
      box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
    }
    .btn-primary:hover {
      color: #0a0e27;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
      transform: translateY(-2px);
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      background: rgba(26, 31, 58, 0.6);
      border-radius: var(--radius);
      border: 1px dashed var(--primary);
      color: var(--text-secondary);
    }
    .empty-state p {
      font-size: 16px;
      margin-bottom: 20px;
    }
    .footer {
      text-align: center;
      color: var(--primary);
      opacity: 0.8;
      margin-top: 50px;
      font-size: 13px;
      letter-spacing: 1px;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .lab-card {
      animation: fadeIn 0.6s ease-in;
    }
    .lab-card:nth-child(2) { animation-delay: 0.1s; }
    .lab-card:nth-child(3) { animation-delay: 0.2s; }
    .lab-card:nth-child(4) { animation-delay: 0.3s; }

</head>
